name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qureo_solver
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.qureosolver --project-name qureo_solver .
      - run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)
          sed -i -E 's/(applicationId[ =]+)"[^"]+"/\1"com.qureosolver.app"/' "$f"
          grep -q '"com.qureosolver.app"' "$f"
          sed -i 's/android:label="[^"]*"/android:label="QUREO Solver"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: qureo-apk
          path: qureo_solver/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
